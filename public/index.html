<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aroh</title>
<meta name="description" content="Aroh. Everything that rises must converge.">
<meta name="theme-color" content="#070707">
<meta property="og:title" content="Aroh">
<meta property="og:description" content="Everything that rises must converge.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aroh.si/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070707'/%3E%3Cg fill='none' stroke='%23eceae4' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M12 54C12 36 32 40 32 22' opacity='.5'/%3E%3Cpath d='M32 54V22'/%3E%3Cpath d='M52 54C52 36 32 40 32 22' opacity='.5'/%3E%3C/g%3E%3Ccircle cx='32' cy='14' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #070707;
    --paper: #eceae4;
    --muted: #7d7b76;
    --display: "Host Grotesk", system-ui, sans-serif;
    --mono: "Red Hat Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gutter: clamp(20px, 4vw, 44px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { background: var(--ink); color-scheme: dark; }

  body {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100svh;
    margin: 0;
    overflow: hidden;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .weave {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .top, .stage, .foot { position: relative; }

  .top { padding: 24px var(--gutter); }

  .wordmark {
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .stage {
    padding: clamp(72px, 17vh, 180px) var(--gutter) 0;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 4.2vw, 3.25rem);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1.05;
    text-wrap: balance;
  }

  .credit {
    margin: 18px 0 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    padding: 24px var(--gutter);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .foot p { margin: 0; }

  .fade {
    opacity: 0;
    animation: fade 2.4s ease-in-out forwards;
    animation-delay: var(--d, 0s);
  }

  @keyframes fade {
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade { opacity: 1; animation: none; }
  }
</style>
</head>
<body>

<canvas class="weave" aria-hidden="true"></canvas>

<header class="top">
  <span class="wordmark">aroh</span>
</header>

<main class="stage">
  <h1 class="fade" style="--d: 2.6s">Everything that rises must converge.</h1>
  <p class="credit fade" style="--d: 3.4s">Pierre Teilhard de Chardin</p>
</main>

<footer class="foot fade" style="--d: 3.8s">
  <p>© 2026 Aroh</p>
  <p>Coming soon</p>
</footer>

<script>
(() => {
  const canvas = document.querySelector('.weave');
  const ctx = canvas.getContext('2d');
  const headline = document.querySelector('.credit');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  const STRANDS = 9;
  const STAGGER = 160;     // ms between strands starting to draw
  const DRAW = 2800;       // ms for one strand to draw in
  const TRUNK_DRAW = 1100; // ms for the single line to draw
  const TRUNK = 0.3;       // share of a particle's journey spent on the single line
  const SEGMENTS = 56;
  const GLOW_IN = 1800;    // ms for the end point's light to fade in
  const TAIL = 10;         // segments in the streak behind each dot
  const INK = '236,234,228';
  // One spectral hue per strand, red at the left through violet at the right.
  // The tint fades to white before the strands meet: a prism run backwards.
  const HUES = Array.from({ length: STRANDS }, (_, i) => Math.round((280 * i) / (STRANDS - 1)));

  let W = 0, H = 0, feet = [], join = { x: 0, y: 0 }, tip = { x: 0, y: 0 };
  let particles = [], nextSpawn = [], energy = 0, glow = 0;
  let started = 0, last = 0, running = false, visible = true;

  const clamp01 = x => Math.max(0, Math.min(1, x));
  // Slow start, slow finish: nothing snaps into place.
  const ease = x => x * x * x * (x * (x * 6 - 15) + 10);

  function measure() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width;
    H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    feet = Array.from({ length: STRANDS }, (_, i) => W * (0.04 + 0.92 * (i / (STRANDS - 1))));
    const h = headline.getBoundingClientRect();
    const tipY = h.bottom - r.top + Math.max(44, H * 0.07);
    tip = { x: W / 2, y: tipY };
    join = { x: W / 2, y: tipY + (H - tipY) * 0.34 };
  }

  // Point on strand i at u (0 = foot, 1 = where the strands join).
  function strandPoint(i, u, sway) {
    const fx = feet[i];
    const s1 = Math.sin(sway * 0.0004 + i * 1.7) * W * 0.012;
    const s2 = Math.cos(sway * 0.0003 + i * 2.3) * W * 0.008;
    const x1 = fx + s1, y1 = join.y + (H - join.y) * 0.5;
    const x2 = join.x + (fx - join.x) * 0.08 + s2, y2 = join.y + (H - join.y) * 0.4;
    const v = 1 - u;
    return [
      v * v * v * fx + 3 * v * v * u * x1 + 3 * v * u * u * x2 + u * u * u * join.x,
      v * v * v * H + 3 * v * v * u * y1 + 3 * v * u * u * y2 + u * u * u * join.y
    ];
  }

  // A particle keeps going past the join, up the single line.
  function journeyPoint(i, u, sway) {
    if (u <= 1) return strandPoint(i, u, sway);
    const k = Math.min((u - 1) / TRUNK, 1);
    return [join.x + (tip.x - join.x) * k, join.y + (tip.y - join.y) * k];
  }

  function draw(elapsed, sway, dt) {
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.lineWidth = 1;

    for (let i = 0; i < STRANDS; i++) {
      const p = ease(clamp01((elapsed - i * STAGGER) / DRAW));
      if (p <= 0) continue;
      const grad = ctx.createLinearGradient(0, H, 0, join.y);
      grad.addColorStop(0, `hsla(${HUES[i]},58%,76%,0.14)`);
      grad.addColorStop(0.55, `hsla(${HUES[i]},58%,78%,0.58)`);
      grad.addColorStop(0.92, `rgba(${INK},0.62)`);
      grad.addColorStop(1, `rgba(${INK},0.62)`);
      ctx.strokeStyle = grad;
      ctx.beginPath();
      for (let s = 0; s <= SEGMENTS; s++) {
        const [x, y] = strandPoint(i, (s / SEGMENTS) * p, sway);
        s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }

    const strandsDone = (STRANDS - 1) * STAGGER + DRAW;
    const trunkP = ease(clamp01((elapsed - strandsDone * 0.86) / TRUNK_DRAW));

    if (trunkP > 0) {
      ctx.beginPath();
      ctx.moveTo(join.x, join.y);
      ctx.lineTo(tip.x, join.y + (tip.y - join.y) * trunkP);
      ctx.strokeStyle = `rgba(${INK},0.9)`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    if (trunkP >= 1) {
      // First dots set off one by one at uneven moments, never as a row.
      if (!nextSpawn.length) nextSpawn = Array.from({ length: STRANDS }, () => elapsed + 200 + Math.random() * 6500);
      for (let i = 0; i < STRANDS; i++) {
        if (dt && elapsed > nextSpawn[i]) {
          particles.push({ i, u: 0, speed: 1 / (2800 + Math.random() * 1200) });
          nextSpawn[i] = elapsed + 2200 + Math.random() * 4200;
        }
      }
      particles = particles.filter(pt => {
        pt.u += pt.speed * dt;
        if (pt.u >= 1 + TRUNK) { energy = Math.min(1, energy + 0.45); return false; }
        // A short streak behind the dot that splits into a spectrum, like
        // light through glass. It loses its colour as the dot nears the join.
        const sat = 58 * (1 - clamp01((pt.u - 0.75) / 0.3));
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = 1.3;
        let prev = journeyPoint(pt.i, pt.u, sway);
        for (let k = 1; k <= TAIL; k++) {
          const u = pt.u - k * 0.009;
          if (u < 0) break;
          const next = journeyPoint(pt.i, u, sway);
          ctx.beginPath();
          ctx.moveTo(prev[0], prev[1]);
          ctx.lineTo(next[0], next[1]);
          ctx.strokeStyle = `hsla(${Math.round((280 * (k - 1)) / (TAIL - 1))},${sat}%,80%,${0.55 * (1 - k / (TAIL + 1))})`;
          ctx.stroke();
          prev = next;
        }
        ctx.globalCompositeOperation = 'source-over';
        const [hx, hy] = journeyPoint(pt.i, pt.u, sway);
        ctx.beginPath();
        ctx.arc(hx, hy, 1.7, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        return true;
      });

    }

    // The point everything arrives at. Its light fades in as the single line
    // reaches it, then breathes slowly on two unrelated rhythms so it never
    // repeats exactly. An arriving dot adds energy that the light eases up to
    // and lets go of gradually, so arrivals swell it instead of flashing it.
    const shown = ease(clamp01((elapsed - strandsDone * 0.86 - TRUNK_DRAW * 0.75) / GLOW_IN));
    if (shown > 0) {
      energy *= Math.exp(-dt / 1100);
      glow += (energy - glow) * (1 - Math.exp(-dt / 260));
      const t = sway * 0.001;
      const breath = 0.5 + 0.3 * Math.sin(t * 1.18) + 0.2 * Math.sin(t * 0.71 + 1);
      const cx = tip.x + Math.sin(t * 0.37) * 2.5;
      const cy = tip.y + Math.cos(t * 0.29) * 2;
      const halo = (40 + breath * 12 + glow * 22) * (0.6 + 0.4 * shown);
      const a = (0.15 + breath * 0.05 + glow * 0.2) * shown;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, halo);
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(0.25, `rgba(255,255,255,${a * 0.5})`);
      g.addColorStop(0.6, `rgba(255,255,255,${a * 0.12})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - halo, cy - halo, halo * 2, halo * 2);
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 3 + glow * 0.8, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${shown})`;
      ctx.fill();
    }
  }

  function frame(now) {
    if (!running) return;
    if (!started) { started = now; last = now; }
    const dt = Math.min(now - last, 50);
    last = now;
    draw(now - started, now - started, dt);
    requestAnimationFrame(frame);
  }

  function drawStill() {
    draw(1e6, 0, 0);
  }

  function update() {
    const shouldRun = visible && !reduced.matches;
    if (shouldRun && !running) {
      running = true;
      last = performance.now();
      requestAnimationFrame(frame);
    } else if (!shouldRun) {
      running = false;
      if (reduced.matches) drawStill();
    }
  }

  new ResizeObserver(() => {
    measure();
    if (!running) drawStill();
  }).observe(canvas);

  document.addEventListener('visibilitychange', () => {
    visible = !document.hidden;
    update();
  });

  reduced.addEventListener('change', update);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  measure();
  update();
})();
</script>
</body>
</html>
